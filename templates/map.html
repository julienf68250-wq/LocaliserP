<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LocaliserP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
    #map { position: absolute; inset: 0; z-index: 1; background: #0f1115; }
    .topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem;
      background: linear-gradient(#0f1115ee, #0f1115aa); color: #e7e9ee;
    }
    .topbar h1 { font-size: 1rem; margin: 0; flex: 0 0 auto; }
    .cards { display: flex; gap: .5rem; overflow-x: auto; flex: 1; }
    .pcard {
      flex: 0 0 auto; background: #191c24cc; border: 1px solid #262a35;
      border-radius: 12px; padding: .5rem .7rem; cursor: pointer; min-width: 130px;
      backdrop-filter: blur(4px);
    }
    .pcard .name { font-weight: 600; font-size: .95rem; }
    .pcard .meta { font-size: .75rem; color: #9aa0b0; margin-top: .15rem; }
    .pcard.stale .meta { color: #ffb454; }
    .pcard.nodata .meta { color: #ff8080; }
    .logout {
      flex: 0 0 auto; color: #8b90a0; text-decoration: none; font-size: .8rem;
      border: 1px solid #2e3340; border-radius: 8px; padding: .4rem .6rem;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .marker-label {
      background: #191c24; color: #fff; border: 2px solid; border-radius: 8px;
      padding: 2px 8px; font-weight: 600; font-size: .8rem; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="topbar">
    <h1>📍 LocaliserP</h1>
    <div class="cards" id="cards"></div>
    <a class="logout" href="/logout">Quitter</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const COLORS = ["#4c7dff", "#ff6b6b", "#2ecc71", "#f7b731", "#a55eea"];
    const map = L.map("map", { zoomControl: true }).setView([46.6, 2.5], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap"
    }).addTo(map);

    const markers = {};   // person -> {marker, circle, color}
    const colorOf = {};
    let firstFit = true;

    function relTime(sec) {
      if (!sec) return "—";
      const d = Math.max(0, Math.floor(Date.now() / 1000) - sec);
      if (d < 60) return "à l'instant";
      if (d < 3600) return "il y a " + Math.floor(d / 60) + " min";
      if (d < 86400) return "il y a " + Math.floor(d / 3600) + " h";
      return "il y a " + Math.floor(d / 86400) + " j";
    }

    async function refresh() {
      let data;
      try {
        const r = await fetch("/api/positions", { cache: "no-store" });
        if (r.status === 302 || r.redirected) { location.href = "/login"; return; }
        data = await r.json();
      } catch (e) { return; }

      const cards = document.getElementById("cards");
      cards.innerHTML = "";
      const bounds = [];

      data.positions.forEach((p, i) => {
        if (!(p.person in colorOf)) colorOf[p.person] = COLORS[i % COLORS.length];
        const color = colorOf[p.person];

        // Carte d'info en haut
        const card = document.createElement("div");
        card.className = "pcard";
        let meta;
        if (!p.has_data) {
          card.classList.add("nodata");
          meta = "Aucune position reçue";
        } else {
          const age = Math.floor(Date.now() / 1000) - (p.tst || p.received_at);
          if (age > 900) card.classList.add("stale");
          const batt = p.battery != null ? " · 🔋" + p.battery + "%" : "";
          meta = relTime(p.tst || p.received_at) + batt;
        }
        card.innerHTML =
          '<div class="name"><span class="dot" style="background:' + color + '"></span>' +
          p.name + '</div><div class="meta">' + meta + "</div>";
        if (p.has_data) card.onclick = () => map.setView([p.lat, p.lon], 16, { animate: true });
        cards.appendChild(card);

        if (!p.has_data) return;
        bounds.push([p.lat, p.lon]);

        // Marqueur + cercle de précision
        if (!markers[p.person]) {
          const icon = L.divIcon({
            className: "",
            html: '<div class="marker-label" style="border-color:' + color + '">' + p.name + "</div>",
            iconAnchor: [0, 0]
          });
          markers[p.person] = {
            marker: L.marker([p.lat, p.lon], { icon }).addTo(map),
            circle: L.circle([p.lat, p.lon], { radius: p.accuracy || 30, color, weight: 1, fillOpacity: 0.1 }).addTo(map)
          };
        } else {
          markers[p.person].marker.setLatLng([p.lat, p.lon]);
          markers[p.person].circle.setLatLng([p.lat, p.lon]).setRadius(p.accuracy || 30);
        }
      });

      if (firstFit && bounds.length) {
        map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15 });
        firstFit = false;
      }
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
