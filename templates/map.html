<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LocaliserP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
    #map { position: absolute; inset: 0; z-index: 1; background: #0f1115; }
    /* En-tête épuré, laisse passer les clics sur la carte en dehors des éléments */
    .topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between; gap: .5rem;
      padding: .6rem .9rem; padding-top: calc(.6rem + env(safe-area-inset-top));
      background: linear-gradient(#0f1115f2, #0f111500); color: #e7e9ee;
      pointer-events: none;
    }
    .topbar h1 { font-size: 1.05rem; margin: 0; pointer-events: auto; }
    .logout {
      pointer-events: auto; color: #e7e9ee; text-decoration: none; font-size: .85rem;
      background: #191c24cc; border: 1px solid #2e3340; border-radius: 10px;
      padding: .55rem .8rem; backdrop-filter: blur(6px);
    }

    /* Contrôles Leaflet sous l'en-tête pour éviter le chevauchement */
    .leaflet-top { top: calc(50px + env(safe-area-inset-top)); }

    /* Panneau bas : une ligne par personne, pensé pour le pouce */
    #panel {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
      display: flex; flex-direction: column; gap: .5rem;
      padding: 1.2rem .7rem calc(.7rem + env(safe-area-inset-bottom));
      background: linear-gradient(#0f111500, #0f1115ee 35%);
      max-height: 55vh; overflow-y: auto;
    }
    .prow {
      display: flex; align-items: center; gap: .6rem;
      background: #191c24ee; border: 1px solid #262a35; border-radius: 14px;
      padding: .55rem .6rem .55rem .8rem; backdrop-filter: blur(6px);
    }
    .prow.stale { border-color: #6b4e1f; }
    .prow.nodata { opacity: .85; }
    .pinfo { flex: 1; min-width: 0; cursor: pointer; }
    .pname { font-weight: 700; font-size: 1rem; color: #fff; display: flex; align-items: center; }
    .pmeta {
      font-size: .82rem; color: #9aa0b0; margin-top: .2rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .prow.stale .pmeta { color: #ffb454; }
    .prow.nodata .pmeta { color: #ff8080; }
    .row-btn {
      flex: 0 0 auto; width: 48px; height: 48px; border-radius: 12px; border: 0;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; -webkit-tap-highlight-color: transparent;
    }
    .row-btn.locate { background: #2b2f3a; }
    .row-btn.refresh { background: #4c7dff; }
    .row-btn:active { transform: scale(.94); }
    .row-btn:disabled { background: #4a5568; cursor: default; opacity: .7; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; flex: 0 0 auto; }
    .marker-pin {
      width: 24px; height: 24px; border-radius: 50%;
      border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.6);
      cursor: pointer;
    }
    .req-btn {
      display: inline-block; margin-top: .5rem; padding: .6rem .9rem; border: 0;
      border-radius: 10px; background: #4c7dff; color: #fff; font-weight: 600;
      font-size: .95em; cursor: pointer;
    }
    .req-btn:disabled { background: #8b90a0; cursor: default; }
    .leaflet-popup-content { margin: .8rem 1rem; }
    #toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: #191c24; color: #fff; border: 1px solid #2e3340; border-radius: 12px;
      padding: .7rem 1rem; font-size: .9rem; max-width: 90vw; text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 2000;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="topbar">
    <h1>📍 LocaliserP</h1>
    <a class="logout" href="/logout" style="pointer-events:auto">Quitter</a>
  </div>
  <div id="panel"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const COLORS = ["#4c7dff", "#ff6b6b", "#2ecc71", "#f7b731", "#a55eea"];
    const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([46.6, 2.5], 6);

    const plan = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap"
    }).addTo(map);
    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19, attribution: "© Esri" });
    L.control.zoom({ position: "topright" }).addTo(map);
    L.control.layers({ "Plan": plan, "Satellite": satellite }, null, { position: "topright" }).addTo(map);
    L.control.attribution({ position: "topright", prefix: false }).addTo(map);

    const markers = {};   // person -> {marker, circle, color}
    const colorOf = {};
    const lastData = {};      // person -> dernière donnée reçue
    const lastReceived = {};  // person -> received_at précédent (détection de mise à jour)
    const clientPending = new Set();  // demandes on-demand en attente côté client
    let openPerson = null;    // parent dont la popup est ouverte
    let firstFit = true;

    function relTime(sec) {
      if (!sec) return "—";
      const d = Math.max(0, Math.floor(Date.now() / 1000) - sec);
      if (d < 60) return "à l'instant";
      if (d < 3600) return "il y a " + Math.floor(d / 60) + " min";
      if (d < 86400) return "il y a " + Math.floor(d / 3600) + " h";
      return "il y a " + Math.floor(d / 86400) + " j";
    }

    function battInfo(p) {
      if (p.battery == null) return "";
      let icon = "🔋";
      if (p.batt_status === 2) icon = "⚡";       // en charge
      else if (p.batt_status === 3) icon = "🔌";  // plein / branché
      return icon + p.battery + "%";
    }

    function connInfo(c) {
      if (c === "w") return "📶 Wifi";
      if (c === "m") return "📱 Mobile";
      if (c === "o") return "🚫 Hors-ligne";
      return "";
    }

    // Cache des adresses (géocodage inverse à la demande, faible volume).
    const addrCache = {};       // coordKey -> adresse
    const lastAddr = {};        // person  -> dernière adresse connue (affichée pendant le chargement)
    function coordKey(lat, lon) { return lat.toFixed(4) + "," + lon.toFixed(4); }

    async function reverseGeocode(lat, lon) {
      const key = coordKey(lat, lon);
      if (addrCache[key]) return addrCache[key];
      try {
        const ctrl = new AbortController();
        const to = setTimeout(function () { ctrl.abort(); }, 5000);  // timeout géocodage
        const r = await fetch(
          "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=fr&lat=" +
          lat + "&lon=" + lon, { headers: { "Accept": "application/json" }, signal: ctrl.signal });
        clearTimeout(to);
        const j = await r.json();
        const a = j.address || {};
        const rue = [a.house_number, a.road].filter(Boolean).join(" ");
        const ville = a.city || a.town || a.village || a.municipality || "";
        const addr = [rue, [a.postcode, ville].filter(Boolean).join(" ")].filter(Boolean).join(", ")
                     || j.display_name || "Adresse inconnue";
        addrCache[key] = addr;
        return addr;
      } catch (e) { return "Adresse indisponible"; }
    }

    // Met à jour la popup d'un parent : affiche l'adresse en cache (ou la précédente),
    // puis lance le géocodage et rafraîchit dès qu'il répond.
    function setPopupFor(p, color) {
      const m = markers[p.person];
      if (!m) return;
      const key = coordKey(p.lat, p.lon);
      m.marker.setPopupContent(popupHtml(p, color, addrCache[key]));
      if (addrCache[key]) {
        lastAddr[p.person] = addrCache[key];
        return;
      }
      reverseGeocode(p.lat, p.lon).then(function (addr) {
        lastAddr[p.person] = addr;
        if (openPerson === p.person && m.marker.isPopupOpen()) {
          m.marker.setPopupContent(popupHtml(p, color, addr));
        }
      });
    }

    function popupHtml(p, color, addr) {
      const rows = [];
      rows.push('<b style="color:' + color + '">' + p.name + "</b>");
      const shownAddr = addr || lastAddr[p.person] || "…recherche de l'adresse";
      rows.push('<div style="margin:.3rem 0;color:#333">📍 ' + shownAddr + "</div>");
      const bits = [];
      bits.push("🕒 " + relTime(p.tst || p.received_at));
      if (p.battery != null) bits.push(battInfo(p));
      if (p.conn) bits.push(connInfo(p.conn));
      rows.push('<div style="color:#555;font-size:.85em;line-height:1.6">' + bits.join(" · ") + "</div>");
      rows.push('<a href="https://www.google.com/maps?q=' + p.lat + "," + p.lon +
                '" target="_blank" style="display:inline-block;margin-top:.4rem;color:#4c7dff;font-weight:600">Ouvrir dans Google Maps ↗</a>');
      const pend = clientPending.has(p.person);
      rows.push('<br><button class="req-btn"' + (pend ? " disabled" : "") +
                ' onclick="requestLocation(\'' + p.person + '\', this)">' +
                (pend ? "⏳ En attente du téléphone…" : "🔄 Demander une position fraîche") + "</button>");
      return '<div style="min-width:200px">' + rows.join("") + "</div>";
    }

    // On-demand : demande une position fraîche au téléphone du parent.
    // Retour INSTANTANÉ (toast), la vraie position arrive au prochain contact du téléphone.
    function requestLocation(person, btn) {
      const p = lastData[person];
      const name = p ? p.name : person;
      if (btn) { btn.disabled = true; btn.textContent = "⏳ En attente du téléphone…"; }
      clientPending.add(person);
      toast("🔄 Demande envoyée à " + name + " — position à jour dès que son téléphone répond");
      // On n'attend pas la réponse réseau pour libérer l'interface : effet instantané.
      fetch("/api/request/" + encodeURIComponent(person), { method: "POST" }).catch(function () {});
      // Rafraîchissement accéléré : on interroge toutes les 2 s pour afficher
      // la position fraîche dès qu'elle arrive (au lieu d'attendre le cycle de 15 s).
      const boost = setInterval(function () {
        refresh();
        if (!clientPending.has(person)) clearInterval(boost);
      }, 2000);
      // Timeout : au bout de 30 s sans réponse, on abandonne et on prévient.
      setTimeout(function () {
        clearInterval(boost);
        if (clientPending.delete(person)) {
          toast("⌛ Pas de réponse de " + name + " — téléphone injoignable ou appli fermée");
          refresh();
        }
      }, 30000);
      refresh();  // reflète l'état "en attente" tout de suite sur le panneau
    }
    window.requestLocation = requestLocation;


    // Petit toast d'information en bas de l'écran.
    let toastTimer = null;
    function toast(msg) {
      let el = document.getElementById("toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove("show"); }, 4000);
    }

    async function focusPerson(p, color) {
      map.setView([p.lat, p.lon], 17, { animate: true });
      const m = markers[p.person];
      if (!m) return;
      openPerson = p.person;
      m.marker.bindPopup(popupHtml(p, color, addrCache[coordKey(p.lat, p.lon)])).openPopup();
      m.marker.off("popupclose").on("popupclose", function () {
        if (openPerson === p.person) openPerson = null;
      });
      setPopupFor(p, color);
    }

    async function refresh() {
      let data;
      try {
        const r = await fetch("/api/positions", { cache: "no-store" });
        if (r.status === 302 || r.redirected) { location.href = "/login"; return; }
        data = await r.json();
      } catch (e) { return; }

      const panel = document.getElementById("panel");
      panel.innerHTML = "";
      const bounds = [];

      data.positions.forEach((p, i) => {
        if (!(p.person in colorOf)) colorOf[p.person] = COLORS[i % COLORS.length];
        const color = colorOf[p.person];
        lastData[p.person] = p;

        // Détection d'une position fraîche arrivée après une demande on-demand.
        if (p.has_data && clientPending.has(p.person) &&
            lastReceived[p.person] != null && p.received_at > lastReceived[p.person]) {
          clientPending.delete(p.person);
          toast("✅ " + p.name + " — position mise à jour");
        }
        if (p.has_data) lastReceived[p.person] = p.received_at;

        const pend = clientPending.has(p.person);

        // Ligne du panneau bas (pouce-friendly)
        const row = document.createElement("div");
        row.className = "prow";
        let meta;
        if (!p.has_data) {
          row.classList.add("nodata");
          meta = "Aucune position reçue";
        } else {
          const age = Math.floor(Date.now() / 1000) - (p.tst || p.received_at);
          if (age > 900) row.classList.add("stale");
          const extras = [relTime(p.tst || p.received_at)];
          if (p.battery != null) extras.push(battInfo(p));
          if (p.conn) extras.push(connInfo(p.conn));
          if (pend) extras.push("⏳");
          meta = extras.join(" · ");
        }

        const info = document.createElement("div");
        info.className = "pinfo";
        info.innerHTML =
          '<div class="pname"><span class="dot" style="background:' + color + '"></span>' +
          p.name + '</div><div class="pmeta">' + meta + "</div>";
        if (p.has_data) info.onclick = () => focusPerson(lastData[p.person], color);
        row.appendChild(info);

        if (p.has_data) {
          const locate = document.createElement("button");
          locate.className = "row-btn locate";
          locate.title = "Centrer sur la carte";
          locate.textContent = "📍";
          locate.onclick = () => focusPerson(lastData[p.person], color);
          row.appendChild(locate);

          const reqBtn = document.createElement("button");
          reqBtn.className = "row-btn refresh";
          reqBtn.title = "Demander une position fraîche";
          reqBtn.textContent = pend ? "⏳" : "🔄";
          reqBtn.disabled = pend;
          reqBtn.onclick = () => requestLocation(p.person, null);
          row.appendChild(reqBtn);
        }

        panel.appendChild(row);

        if (!p.has_data) return;
        bounds.push([p.lat, p.lon]);

        // Marqueur + cercle de précision
        if (!markers[p.person]) {
          const icon = L.divIcon({
            className: "",
            html: '<div class="marker-pin" style="background:' + color + '"></div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          const marker = L.marker([p.lat, p.lon], { icon }).addTo(map);
          marker.on("click", () => focusPerson(lastData[p.person], color));
          markers[p.person] = {
            marker: marker,
            circle: L.circle([p.lat, p.lon], { radius: p.accuracy || 30, color, weight: 1, fillOpacity: 0.1 }).addTo(map)
          };
        } else {
          markers[p.person].marker.setLatLng([p.lat, p.lon]);
          markers[p.person].circle.setLatLng([p.lat, p.lon]).setRadius(p.accuracy || 30);
        }

        // Popup ouverte : on la garde à jour (bouton, infos, adresse) à chaque refresh.
        if (openPerson === p.person && markers[p.person].marker.isPopupOpen()) {
          setPopupFor(p, color);
        }
      });

      if (firstFit && bounds.length) {
        map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15 });
        firstFit = false;
      }
    }

    // À l'ouverture : demande UNE position fraîche à tous (on-demand), puis boost.
    // Ensuite, le rafraîchissement périodique ne fait que LIRE le serveur (0 data téléphone).
    function locateAllOnOpen() {
      const persons = Object.keys(lastData);
      if (!persons.length) return;
      persons.forEach(function (p) { clientPending.add(p); });
      fetch("/api/request/all", { method: "POST" }).catch(function () {});
      toast("🔄 Recherche de la position…");
      const boost = setInterval(function () {
        refresh();
        if (persons.every(function (p) { return !clientPending.has(p); })) clearInterval(boost);
      }, 2000);
      setTimeout(function () {
        clearInterval(boost);
        persons.forEach(function (p) { clientPending.delete(p); });
        refresh();
      }, 30000);
    }

    // Chargement initial : on lit le serveur, puis on demande une position fraîche.
    refresh().then(locateAllOnOpen);
    // Lecture périodique du serveur (aucune sollicitation du téléphone, aucune data).
    setInterval(refresh, 15000);
  </script>
</body>
</html>
